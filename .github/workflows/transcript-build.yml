name: transcript-build
on:
  push:
    branches:
      - transcript-build-20260816
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: assemble
        run: |
          mkdir -p transcript_job
          cat transcript_job/part1.pyfrag transcript_job/part2.pyfrag > transcript_job/collect.py
          python -m py_compile transcript_job/collect.py transcript_job/fast.py
      - name: install
        run: python -m pip install --upgrade requests "yt-dlp[default,curl-cffi]" youtube-transcript-api
      - name: collect
        continue-on-error: true
        run: python transcript_job/fast.py --output gleb_solomin_transcripts --workers 4
      - name: validate
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('gleb_solomin_transcripts')
          ru = list((root / 'ru').glob('*.txt'))
          en = list((root / 'en').glob('*.txt'))
          assert len(ru) == 139, len(ru)
          assert len(en) == 8, len(en)
          assert (root / 'index.tsv').exists()
          assert (root / 'stats.txt').exists()
          print((root / 'stats.txt').read_text(encoding='utf-8'))
          PY
      - name: archive
        if: always()
        run: zip -qr gleb_solomin_transcripts.zip gleb_solomin_transcripts
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gleb-solomin-transcripts
          path: gleb_solomin_transcripts.zip
          if-no-files-found: error
          retention-days: 7
