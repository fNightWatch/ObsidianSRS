name: apple-podcast-probe

on:
  push:
    branches:
      - transcript-build-20260816
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcript-build-20260816
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python transcript_job/apple_probe.py
