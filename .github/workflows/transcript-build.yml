name: transcript-build

on:
  push:
    branches:
      - transcript-build-20260816
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcript-build-20260816
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: assemble
        run: |
          cat transcript_job/final_collect.part* > transcript_job/final_collect.py
          test "$(wc -c < transcript_job/final_collect.py)" = "21610"
          test "$(git hash-object transcript_job/final_collect.py)" = "89f4929ccadec8bb082689cf5c03bb944fb64a81"
          python -m py_compile transcript_job/final_collect.py

      - name: install
        run: python -m pip install --upgrade requests

      - name: collect
        id: collect
        continue-on-error: true
        run: |
          python transcript_job/final_collect.py \
            --input transcript_job/videos.tsv \
            --output gleb_solomin_transcripts_2026-08-16 \
            --workers 6

      - name: inspect
        if: always()
        run: |
          if [ -f gleb_solomin_transcripts_2026-08-16/stats.txt ]; then
            cat gleb_solomin_transcripts_2026-08-16/stats.txt
          fi
          if [ -f gleb_solomin_transcripts_2026-08-16/errors.tsv ]; then
            cat gleb_solomin_transcripts_2026-08-16/errors.tsv
          fi

      - name: archive
        if: always()
        run: |
          if [ -d gleb_solomin_transcripts_2026-08-16 ]; then
            zip -qr gleb_solomin_transcripts_2026-08-16.zip gleb_solomin_transcripts_2026-08-16
          fi

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gleb-solomin-transcripts-2026-08-16
          path: gleb_solomin_transcripts_2026-08-16.zip
          if-no-files-found: error
          retention-days: 7

      - name: fail-if-incomplete
        if: always() && steps.collect.outcome != 'success'
        run: exit 1
