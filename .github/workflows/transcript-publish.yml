name: transcript-publish

on:
  push:
    branches:
      - transcript-build-20260816

permissions:
  contents: write

jobs:
  collect:
    if: ${{ !contains(github.event.head_commit.message, '[skip transcript]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade requests
      - run: python transcript_job/proxy_collect.py --input transcript_job/videos.tsv --output gleb_solomin_transcripts --workers 10
      - run: |
          cat gleb_solomin_transcripts/stats.txt
          head -100 gleb_solomin_transcripts/errors.tsv
          test "$(find gleb_solomin_transcripts/ru -name '*.txt' | wc -l)" = "139"
          test "$(find gleb_solomin_transcripts/en -name '*.txt' | wc -l)" = "8"
      - run: zip -qr transcript_job/gleb_solomin_transcripts_result.zip gleb_solomin_transcripts
      - uses: actions/upload-artifact@v4
        with:
          name: gleb-solomin-transcripts-published
          path: transcript_job/gleb_solomin_transcripts_result.zip
          retention-days: 7
      - name: publish result
        run: |
          git config user.name transcript-build
          git config user.email actions@users.noreply.github.com
          git add -f transcript_job/gleb_solomin_transcripts_result.zip
          git commit -m "Store transcript result [skip transcript]"
          git push
